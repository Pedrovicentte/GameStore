<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Play Zone</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/login.css">
    <link rel="shortcut icon" href="imagens/favicon.png" type="image/x-icon">
    <script src="script/login.js" defer ></script>
</head>
<body>

    <nav class="navbar">
        <img class="logo" src="imagens/logo.png" alt="Logo" onclick="window.location.href='index.html'">
        <ul>
            <li>
                <div class="button-borders">
                    <button class="primary-button" onclick="window.location.href='index.html#super-ofertas'">OFERTAS</button>
                </div>
            </li>
            <li>
                <div class="button-borders">
                    <button class="primary-button" onclick="window.location.href='index.html'">ABOUT</button>
                </div>
            </li>
            <li>
                <div class="button-borders">
                    <button class="primary-button">LOGIN</button>
                </div>
            </li>
        </ul>
    </nav>

    <main id="login-page">
        <div class="login-card">
            <h2>BEM-VINDO</h2>
            <p>Faça login para acessar sua conta Play Zone.</p>

            <form action="#" method="POST">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="••••••••" required>
                </div>

                <div class="opcoes-login">
                    <label>
                        <input type="checkbox" name="lembrar"> Lembrar de mim
                    </label>
                    <a href="#">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn-login">ENTRAR</button>
            </form>

            <div class="registro-link">
                Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a>
            </div>
        </div>
    </main>

</body>
</html>
